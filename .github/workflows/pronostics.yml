# Publication automatique des pronostics MISSA FOOT 360.
# Toutes les 3 heures : téléchargement des matchs et des cotes, calcul du moteur,
# puis publication du résultat sur la branche « pronostics », lue par l'application :
#   https://raw.githubusercontent.com/<dépôt>/pronostics/pronostics.json
name: Pronostics automatiques

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures (heure UTC), à hh:17
  workflow_dispatch:          # lancement manuel depuis l'onglet « Actions »

permissions:
  contents: write

concurrency:
  group: pronostics
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Restaurer les données déjà téléchargées
        uses: actions/cache@v4
        with:
          path: data/cache/*.csv
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Calculer les pronostics
        run: python scripts/publier.py --sortie publication

      - name: Publier sur la branche « pronostics »
        working-directory: publication
        run: |
          git init -q -b pronostics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Pronostics du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pronostics
